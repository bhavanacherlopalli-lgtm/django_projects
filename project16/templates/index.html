<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dff9f3;
            color: #222;
        }

        /* NAVBAR */

        nav {
            height: 75px;
            background-color: #dff9f3;

            display: flex;
            align-items: center;

            padding: 0 55px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-right: 45px;
        }

        .menu {
            display: flex;
            gap: 28px;
        }

        .menu a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .right-menu {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .login {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .signup {
            background-color: #6c63ff;
            color: white;

            border: none;
            border-radius: 25px;

            padding: 12px 25px;

            cursor: pointer;
        }


        /* MAIN SECTION */

        .hero {
            min-height: calc(100vh - 75px);

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            overflow: hidden;
        }


        /* SMALL CIRCLES */

        .dots {
            position: absolute;
            top: 90px;
            left: 28%;

            display: flex;
            gap: 8px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
        }

        .dot1 {
            background-color: #f39c6b;
        }

        .dot2 {
            background-color: #7177e8;
        }

        .dot3 {
            background-color: #a6a6a6;
        }

        .dot4 {
            background-color: #527d68;
        }


        /* CENTER CONTENT */

        .content {
            width: 650px;
            margin-top: 20px;
        }

        h1 {
            font-size: 64px;
            line-height: 0.98;
            font-weight: 400;

            letter-spacing: -2px;

            margin-bottom: 25px;
        }

        .description {
            font-size: 15px;
            line-height: 1.5;

            width: 390px;

            margin: auto;

            color: #555;
        }


        /* BUTTON */

        .start {
            margin-top: 25px;

            background-color: #7468e8;
            color: white;

            border: none;
            border-radius: 30px;

            padding: 15px 35px;

            font-size: 15px;

            cursor: pointer;
        }

        .small-text {
            margin-top: 12px;

            font-size: 11px;
            color: #777;
        }


        /* LEFT IMAGE CARD */

        .left-card {
            position: absolute;

            left: 8%;
            top: 27%;

            width: 150px;
            height: 180px;

            background-color: #70847d;

            border-radius: 8px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mushroom {
            width: 75px;
            height: 100px;

            position: relative;
        }

        .mushroom-top {
            width: 75px;
            height: 42px;

            background-color: #eee;

            border-radius: 50% 50% 15% 15%;

            position: absolute;
            top: 10px;
        }

        .mushroom-stem {
            width: 35px;
            height: 65px;

            background-color: #c98267;

            position: absolute;
            top: 38px;
            left: 20px;

            border-radius: 5px;
        }

        .card-label {
            position: absolute;

            bottom: 12px;
            left: 20px;

            background-color: white;

            border-radius: 15px;

            padding: 5px 12px;

            font-size: 9px;
        }


        /* RIGHT IMAGE CARD */

        .right-card {
            position: absolute;

            right: 7%;
            top: 48%;

            width: 145px;
            height: 180px;

            background-color: #bd796c;

            border-radius: 8px;

            overflow: hidden;
        }

        .person {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .person-head {
            width: 48px;
            height: 48px;

            background-color: #c99b82;

            border-radius: 50%;

            position: absolute;
            top: 35px;
        }

        .person-body {
            width: 75px;
            height: 100px;

            background-color: #315f4d;

            border-radius: 40px 40px 0 0;

            position: absolute;
            bottom: 0;
        }

        .right-label {
            position: absolute;

            top: -28px;
            left: 10px;

            background-color: white;

            padding: 6px 15px;

            border-radius: 15px;

            font-size: 10px;
        }


        /* BOTTOM LOGO */

        .brand {
            position: absolute;

            left: 28%;
            bottom: 70px;

            font-size: 35px;

            font-weight: bold;

            letter-spacing: 3px;

            color: #777;
        }


        /* RESPONSIVE */

        @media (max-width: 900px) {

            .menu {
                display: none;
            }

            nav {
                padding: 0 25px;
            }

            h1 {
                font-size: 48px;
            }

            .left-card {
                left: 3%;
                transform: scale(.8);
            }

            .right-card {
                right: 3%;
                transform: scale(.8);
            }

            .brand {
                left: 20%;
            }
        }

        @media (max-width: 650px) {

            .hero {
                padding: 30px;
            }

            .content {
                width: 100%;
            }

            h1 {
                font-size: 42px;
            }

            .description {
                width: 90%;
            }

            .left-card,
            .right-card,
            .brand {
                display: none;
            }

        }

    </style>

    <title>Create a Website</title>

    
</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            WIX
        </div>

        <div class="menu">

            <a href="#">About Us</a>
            <a href="#">Solutions</a>
            <a href="#">Resources</a>
            <a href="#">Pricing</a>
            <a href="#">Wix Studio</a>
            <a href="#">Enterprise</a>

        </div>


        <div class="right-menu">

            <a href="#" class="login">
                Log In
            </a>

            <button class="signup">
                Get Started
            </button>

        </div>

    </nav>



    <!-- HERO SECTION -->

    <section class="hero">


        <!-- SMALL COLORED DOTS -->

        <div class="dots">

            <div class="dot dot1"></div>
            <div class="dot dot2"></div>
            <div class="dot dot3"></div>
            <div class="dot dot4"></div>

        </div>



        <!-- LEFT CARD -->

        <div class="left-card">

            <div class="mushroom">

                <div class="mushroom-top"></div>

                <div class="mushroom-stem"></div>

            </div>

            <div class="card-label">
                Creative design
            </div>

        </div>



        <!-- CENTER -->

        <div class="content">

            <h1>
                Create a website
                <br>
                without limits
            </h1>


            <p class="description">

                Bring your vision to life with the website builder
                that gives you the tools you need to succeed.

            </p>


            <button class="start">
                Get Started
            </button>


            <p class="small-text">
                Start for free. No credit card required.
            </p>

        </div>



        <!-- RIGHT CARD -->

        <div class="right-card">

            <div class="right-label">
                Amazing sites
            </div>

            <div class="person">

                <div class="person-head"></div>

                <div class="person-body"></div>

            </div>

        </div>



        <!-- BOTTOM BRAND -->

        <div class="brand">
            ERÜN
        </div>


    </section>


</body>
</html>
