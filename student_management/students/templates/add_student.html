<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Add Student</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Name" class="form-control mb-2" required>
        <input type="email" name="email" placeholder="Email" class="form-control mb-2">
        <input type="text" name="phone" placeholder="Phone" class="form-control mb-2">
        <input type="text" name="age" placeholder="Age" class="form-control mb-2">
        <input type="text" name="course" placeholder="Course" class="form-control mb-2">
        <button type="submit" class="btn btn-primary">Save Student</button>
        <a href="/home/" class="btn btn-secondary">Back</a>
    </form>
</body>
</html>
