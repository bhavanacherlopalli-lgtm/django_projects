<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Student List</h2>

    <table class="table">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.course }}</td>
            <td>
                <a href="/update/{{student.id}}/" class="btn-primary">Edit</a>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="6">No students found.</td>
        </tr>

        {% endfor %}

    </table>

    <a href="/home/" class="btn btn-primary">Back to Home</a>

</div>

</body>
</html>
