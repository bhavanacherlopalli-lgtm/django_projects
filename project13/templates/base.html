<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .container {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/home/">Home</a>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
